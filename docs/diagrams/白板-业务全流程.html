<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>刘全业务流程白板（讨论中逐步绘制）</title>
<style>
  :root { --ink:#1a2b4d; --line:#5b6b8c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; background:#f4f6fb; color:var(--ink); }
  header { position:sticky; top:0; z-index:10; background:#fff; border-bottom:2px solid #dfe6f2; padding:10px 20px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:17px; margin:0; font-weight:700; }
  header .sub { font-size:12px; color:#7a8aa8; }
  #toolbar { margin-left:auto; display:flex; gap:8px; align-items:center; }
  button { font:inherit; font-size:13px; padding:6px 14px; border:1px solid #c3cfe4; border-radius:6px; background:#fff; cursor:pointer; }
  button:hover { background:#eef3fc; }
  button.primary { background:#1565c0; color:#fff; border-color:#1565c0; }
  button.primary:hover { background:#0d47a1; }
  #speed { font-size:12px; color:#7a8aa8; }
  #stage { overflow:auto; height:calc(100vh - 52px); }
  #canvas { position:relative; width:2600px; height:1500px; background:#fff;
    background-image:radial-gradient(circle,#e7ecf5 1px,transparent 1px); background-size:24px 24px; }
  /* 节点 */
  .node { position:absolute; width:230px; min-height:66px; border-radius:10px; padding:10px 12px;
    font-size:13px; line-height:1.5; display:flex; align-items:center; justify-content:center; text-align:center;
    border:2px solid; box-shadow:0 2px 6px rgba(26,43,77,.08); opacity:0; }
  .node .badge { position:absolute; top:-9px; left:-9px; width:22px; height:22px; border-radius:50%;
    color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .node.show { opacity:1; transition:opacity .6s ease; }
  /* 类型配色 */
  .src  { background:#e8f5e9; border-color:#2e7d32; } .src .badge{background:#2e7d32;}
  .pool { background:#fff3e0; border-color:#e65100; } .pool .badge{background:#e65100;}
  .imgp { background:#f3e5f5; border-color:#6a1b9a; } .imgp .badge{background:#6a1b9a;}
  .plain{ background:#fce4ec; border-color:#c62828; } .plain .badge{background:#c62828;}
  .sale { background:#e3f2fd; border-color:#1565c0; } .sale .badge{background:#1565c0;}
  .rule { background:#fffde7; border-color:#f9a825; border-style:dashed; } .rule .badge{background:#f9a825;}
  /* 连线 */
  svg.overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .edge { opacity:0; }
  .edge.show { opacity:1; transition:opacity .5s ease; }
  .edge-path { stroke:var(--line); stroke-width:2; fill:none; }
  .edge-label { font-size:12px; fill:#7a8aa8; }
  /* 阶段标题 */
  .phase-title { position:absolute; font-size:16px; font-weight:700; opacity:0; }
  .phase-title.show { opacity:1; transition:opacity .6s ease; }
  .phase-box { position:absolute; border:2px dashed #c3cfe4; border-radius:14px; opacity:0; }
  .phase-box.show { opacity:1; transition:opacity .6s ease; }
</style>
</head>
<body>
<header>
  <h1>🖍 刘全业务流程白板</h1>
  <span class="sub">讨论中逐步绘制 · 已确认：①素材采集 ②图挂(SKU×店铺) ③上架必引系统内SKU</span>
  <div id="toolbar">
    <span id="speed">速度：中</span>
    <button id="btnPlay" class="primary">▶ 从头播放绘制过程</button>
    <button id="btnSlow">慢速</button>
    <button id="btnFast">快速</button>
  </div>
</header>
<div id="stage"><div id="canvas">
  <svg class="overlay" id="svgOverlay"></svg>
</div></div>

<script>
// ============ 白板数据（每确认一个点，往这里加）============
const PHASES = [
  { id:"p1", title:"① 素材采集", x:40, y:60, w:940, h:560, color:"#2e7d32" },
  { id:"p2", title:"② 图片处理 → 图挂 SKU×店铺", x:1060, y:60, w:1480, h:560, color:"#1565c0" },
];

const NODES = [
  // ---- ① 素材采集（已确认）----
  { id:"n-grab",   type:"src",  x:90,  y:170, w:230, h:76,  badge:"1",
    label:"扒图<br/>填链接（小红书/闲鱼）<br/>图+标题/标签/作者" },
  { id:"n-camera", type:"src",  x:90,  y:330, w:230, h:76,  badge:"2",
    label:"相机拍摄<br/>自己拍的实拍图<br/>（无链接无标题）" },
  { id:"n-pool",   type:"pool", x:430, y:250, w:230, h:76,  badge:"3",
    label:"素材<br/>两类图汇合" },
  { id:"n-comfy",  type:"imgp", x:760, y:150, w:240, h:86,  badge:"4",
    label:"COMFYUI 处理<br/>换背景/去水印/修图/生成<br/>（大部分图走这里）" },
  { id:"n-direct", type:"plain",x:760, y:360, w:240, h:86,  badge:"5",
    label:"不经过 COMFYUI<br/>直接用原图<br/>（一部分图）" },
  // ---- ② 图片处理 → 可用商品图 → 图挂 SKU×店铺（新增）----
  { id:"n-usable", type:"pool", x:1100, y:250, w:250, h:86,  badge:"6",
    label:"可用商品图池<br/>处理后的图 + 直接用的图<br/>汇合" },
  { id:"n-saleA",  type:"sale", x:1500, y:100, w:300, h:92,  badge:"7",
    label:"SKU-打火机 × 店铺A<br/>→ 一套图（主图/轮播/详情）<br/>店铺A的打火机图集" },
  { id:"n-saleB",  type:"sale", x:1500, y:250, w:300, h:92,  badge:"8",
    label:"SKU-打火机 × 店铺B<br/>→ 另一套图<br/>（同商品，店铺B风格）" },
  { id:"n-saleAB", type:"sale", x:1500, y:400, w:300, h:92,  badge:"9",
    label:"套餐(打火机+烟) × 店铺A<br/>→ 套餐图（拼图或专门拍）<br/>属于套餐卖法×店铺A" },
  { id:"n-rule",   type:"rule", x:1930, y:250, w:560, h:110, badge:"★",
    label:"关键规则：一套图 = 1 SKU × 1 店铺<br/>同一商品跨店各用各的图（风格/定位差异）<br/>店铺=通用实体（Etsy/闲鱼/未来平台无区别）<br/>系统里没有的 SKU 禁止上架" },
];

const EDGES = [
  // ---- ① 素材采集 ----
  { id:"e1", from:"n-grab",   to:"n-pool",  label:"" },
  { id:"e2", from:"n-camera", to:"n-pool",  label:"" },
  { id:"e3", from:"n-pool",   to:"n-comfy", label:"大部分" },
  { id:"e4", from:"n-pool",   to:"n-direct",label:"一部分" },
  // ---- ② 图片处理 → 图挂 SKU×店铺 ----
  { id:"e5", from:"n-comfy",  to:"n-usable", label:"处理后的图" },
  { id:"e6", from:"n-direct", to:"n-usable", label:"原图" },
  { id:"e7", from:"n-usable", to:"n-saleA",  label:"打火机×店A" },
  { id:"e8", from:"n-usable", to:"n-saleB",  label:"打火机×店B" },
  { id:"e9", from:"n-usable", to:"n-saleAB", label:"套餐×店A" },
];

// ============ 渲染引擎 ============
const canvas = document.getElementById("canvas");
const svg = document.getElementById("svgOverlay");
const order = []; // 绘制顺序：阶段框 → 节点 → 连线

function el(tag, cls, html) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html !== undefined) d.innerHTML = html;
  return d;
}

function addPhase(p) {
  const box = el("div","phase-box");
  box.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;border-color:${p.color};`;
  canvas.appendChild(box);
  const t = el("div","phase-title");
  t.style.cssText = `left:${p.x+14}px;top:${p.y+10}px;color:${p.color};`;
  t.textContent = p.title;
  canvas.appendChild(t);
  order.push({ kind:"phase", els:[box, t] });
}

function addNode(n) {
  const d = el("div","node " + n.type);
  d.id = n.id;
  d.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;min-height:${n.h}px;`;
  d.innerHTML = `<span class="badge">${n.badge}</span>${n.label}`;
  canvas.appendChild(d);
  order.push({ kind:"node", els:[d] });
}

function anchor(n, side) {
  if (side==="r") return { x:n.x+n.w, y:n.y+n.h/2 };
  if (side==="l") return { x:n.x,     y:n.y+n.h/2 };
  if (side==="b") return { x:n.x+n.w/2, y:n.y+n.h };
  return { x:n.x+n.w/2, y:n.y };
}

function addEdge(e) {
  const N = Object.fromEntries(NODES.map(n=>[n.id,n]));
  const a = N[e.from], b = N[e.to];
  const aRight = a.x + a.w, bRight = b.x + b.w;
  let p1, p2;
  if (aRight <= b.x) { p1 = anchor(a,"r"); p2 = anchor(b,"l"); }
  else if (bRight <= a.x) { p1 = anchor(a,"l"); p2 = anchor(b,"r"); }
  else if (a.y + a.h <= b.y) { p1 = anchor(a,"b"); p2 = anchor(b,"t"); }
  else { p1 = anchor(a,"t"); p2 = anchor(b,"b"); }
  const mid = { x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 };
  const dx = Math.abs(p2.x-p1.x), dy = Math.abs(p2.y-p1.y);
  let c1, c2;
  if (dx > dy) {
    const off = Math.max(30, Math.min(80, dx*0.35));
    c1 = { x:p1.x + (p2.x>p1.x?off:-off), y:p1.y };
    c2 = { x:p2.x + (p2.x>p1.x?-off:off), y:p2.y };
  } else {
    const off = Math.max(30, Math.min(80, dy*0.35));
    c1 = { x:p1.x, y:p1.y + (p2.y>p1.y?off:-off) };
    c2 = { x:p2.x, y:p2.y + (p2.y>p1.y?-off:off) };
  }
  const g = document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","edge"); g.id = e.id;
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("class","edge-path");
  path.setAttribute("d", `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`);
  g.appendChild(path);
  const ang = Math.atan2(p2.y-c2.y, p2.x-c2.x);
  const arr = document.createElementNS("http://www.w3.org/2000/svg","polygon");
  const s=9, w=4.5;
  arr.setAttribute("points",
    `${p2.x},${p2.y} ${p2.x-s*Math.cos(ang)-w*Math.sin(ang)},${p2.y-s*Math.sin(ang)+w*Math.cos(ang)} ${p2.x-s*Math.cos(ang)+w*Math.sin(ang)},${p2.y-s*Math.sin(ang)-w*Math.cos(ang)}`);
  arr.setAttribute("fill","#5b6b8c");
  g.appendChild(arr);
  if (e.label) {
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("class","edge-label");
    t.setAttribute("x", mid.x); t.setAttribute("y", mid.y-6);
    t.setAttribute("text-anchor","middle");
    t.textContent = e.label;
    g.appendChild(t);
  }
  svg.appendChild(g);
  order.push({ kind:"edge", els:[g] });
}

PHASES.forEach(addPhase);
NODES.forEach(addNode);
EDGES.forEach(addEdge);

// ============ 播放 ============
let playing = false, timer = null, step = 0;
const speedBase = { slow: 900, mid: 450, fast: 150 };
let speed = "mid";

function showStep(i) {
  const item = order[i];
  if (!item) return;
  item.els.forEach(x => x.classList.add("show"));
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById("btnPlay").disabled = true;
  step = 0;
  showStep(step++);
  timer = setInterval(() => {
    if (step >= order.length) {
      clearInterval(timer); playing = false;
      document.getElementById("btnPlay").disabled = false;
      document.getElementById("btnPlay").textContent = "↻ 重新播放";
      return;
    }
    showStep(step++);
  }, speedBase[speed]);
}

document.getElementById("btnPlay").addEventListener("click", () => {
  order.forEach(it => it.els.forEach(x => x.classList.remove("show")));
  step = 0; play();
});
document.getElementById("btnSlow").addEventListener("click", () => {
  speed = "slow"; document.getElementById("speed").textContent = "速度：慢";
});
document.getElementById("btnFast").addEventListener("click", () => {
  speed = "fast"; document.getElementById("speed").textContent = "速度：快";
});

play();
</script>
</body>
</html>
