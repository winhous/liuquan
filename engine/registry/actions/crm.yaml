# crm 域 Action 登记（详设-v0.3 §5.4；决策 19 候选落库）
# crm.candidate：todo_generate 产出 TodoCandidateResult（候选数组）关联的
# Action——链完成由消费者 crm_candidate 校验（禁幻觉三件套）后经写接口落
# crm.todo_candidate（决策 26 接口化）。target 白名单 {tm.proposal, crm.todo_candidate}。
- action_id: crm.candidate
  domain: crm
  risk: suggest
  output_model: TodoCandidateResult
  target: crm.todo_candidate
# crm.image：crm_image_chain 产出 ImageSaveResult 关联的 Action
# 链完成由消费者 crm_image_save 经写接口 PATCH /api/biz/crm/message-images/{id}
# 落下载状态 + ocr_text（决策 26 接口化）。
- action_id: crm.image
  domain: crm
  risk: suggest
  output_model: ImageSaveResult
  target: crm.todo_candidate  # 暂用 todo_candidate 作为 target，实际不落 tm.task
