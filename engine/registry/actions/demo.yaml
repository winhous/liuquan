# target 一期唯一合法值 tm.proposal（loader L10 锁死）；demo 域只登记不消费。
- action_id: demo_echo_record
  domain: demo
  risk: read
  output_model: DemoEchoResult
  target: tm.proposal
# v0.2 T4：tm.proposal Action——demo_propose 工序产出的 TaskProposal 关联它
# （详设-v0.2 §7：action tm.proposal / risk suggest）；target 锁死 tm.proposal。
- action_id: tm.proposal
  domain: demo
  risk: suggest
  output_model: TaskProposal
  target: tm.proposal
