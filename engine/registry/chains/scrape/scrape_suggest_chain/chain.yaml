# scrape_suggest_chain 链声明（详设-v0.6 §5.1，拆两链后瘦身为单步，T6）
# 勾图选品：image_ids → product_suggestion（诚实化：真接 LLM，经 provider
# scrape.image_context 拿元数据入 prompt → SuggestionResult → 提案审核）
# 链完成 → 消费者 scrape.suggest（SuggestionResult → TaskProposal →
# POST /api/biz/tm/proposals → tm.task_proposal pending）

id: scrape_suggest_chain
domain: scrape
description: 扒图选品链：AI 基于图片元数据生成选品建议（真接 LLM → 提案审核）
input:
  model: SuggestionInput
steps:
  - worker: product_suggestion
