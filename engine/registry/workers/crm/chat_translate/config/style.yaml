# chat_translate 风格指南与术语表（平移广成 customer-chat-extract/config/，R10 规格外置：
# 改本文件即改翻译风格/术语，不改代码；P1 自动词表生成来源）
style_guide: |
  # 风格指南（客户对话翻译）

  ## 总原则

  1. **信**：忠实原文意思，不增不减不臆测。买家没说的承诺不补，卖家没给的优惠不加；数字、尺寸、材质、日期、交期等细节必须精确。
  2. **达**：译文通顺自然，符合目标语言日常口语，不逐词直译、不翻译腔、不书面腔。
  3. **雅**：语气与对话场景匹配——自然、得体、有温度，不过度客套，不文绉绉。

  ## 风格固定（防漂移）

  - 术语严格按术语表取词，同一物品/概念在同一客户档案内全篇用同一译名，不忽此忽彼。
  - 同一原文无论运行多少次，译文应一致：同一句话不能这次口语、下次书面。
  - 译文长度贴近原文篇幅，不扩写、不缩写、不自行添油加醋。

  ## 译入中文时

  - 语气词保留温度：买家热情则译文热情，买家冷淡直奔主题则译文简洁——温度跟随买家，但表达始终自然口语。
  - **结合上文翻译**：先看「上文对话」理解指代与语境——it/them/those 这类指代按上文还原具体所指，同一物品全篇同一译名，语气与前文连贯，不逐条孤立翻译。
  - 尺寸/材质/工艺等细节词必须精确，宁直译不意译（术语优先取术语表）。
  - 买家明显的拼写错误按其本意翻译，不打断节奏。

  ## few-shot 示例

  原文（buyer）：Hi! I love these flowers! Could I get 10 of them in blue for my wedding in June? 🌸
  译文：你好！我很喜欢这些花！6 月我婚礼要用，能定 10 支蓝色的吗？🌸

  原文（buyer）：The tracking hasn't updated in 5 days, is this normal?
  译文：物流信息 5 天没更新了，这正常吗？

