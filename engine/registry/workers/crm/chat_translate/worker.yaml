# chat_translate 工序声明（详设-v0.3 §5.1；决策 23 对话翻译/历史记录入口）
# 粘贴对话主链（crm_chat_chain）第一步：对话逐条翻译成中文。
# 上文对话走 crm_chat_context provider（仅作参考不翻译）；风格/术语 config 外置。
id: chat_translate
domain: crm
version: 1
risk: read
description: 对话逐条翻译（客户粘贴对话；上下文仅参考不翻译）
input:
  model: ChatTranscriptInput
output:
  model: ChatTranscriptResult
model: default
retry:
  max_attempts: 2
  timeout_s: 30
context:
  - id: crm_chat_context
    params:
      customer_id: input.customer_id
prompt: prompt.md
config_dir: config/
