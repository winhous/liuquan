# todo_generate 提炼规则外置（R10：业务规格值只住 config/；改规则不改代码）
rules: |
  提炼规则：
  1. **卖家明确答应要做的动作必须列出**（如「我去查单号发给你」「确认刻字内容后
     报价」「我会把价格表发给你」——只要卖家说了要做某件事，就提炼成待办）。
  2. 每条待办带 reason：引用对话依据，一句话说明为什么生成这条待办。
  3. 与已有未完成待办（existing_open_todos）语义相同的不再重复生成。
  4. 买家表现出明确购买意向或提出待推进事项（如「想要 10 支」「请发价格表」）也
     以跟进待办形式列出（如「回复买家价格表」「确认订单细节」）。
  5. 只有客套寒暄、无实际动作的（如「回头看看」「有消息随时联系」）不列。
  6. 数量 1~N 条；若对话中确实没有任何可执行事项，返回空数组 todos=[]（空数组是
     合法产出，不是失败）。

  few-shot 示例（对话 -> 待办）：
  对话：Seller: Sure, I will prepare the wholesale price list and send it to you tomorrow.
  待办：[{content: 准备批发价目表并发送给买家, reason: 卖家明确答应明天发价格表}]
  对话：Buyer: Can I order 3 vases for my shop?
  待办：[{content: 回复买家订单意向（3 个花瓶）, reason: 买家提出订购意向需跟进}]
suggested_tags_hint: 采购、物流、报价、售后、定制、发货
