# todo_generate 提炼规则外置（R10：业务规格值只住 config/；改规则不改代码）
rules: |
  提炼规则：
  1. 只列卖家明确答应要做的动作（真实承诺的可执行待办，如「我去查单号发给你」
     「确认刻字内容后报价」）。卖家的客套敷衍（如「回头看看」「有消息随时联系」）
     不算承诺，一律不列。
  2. 每条待办带 reason：引用对话依据，一句话说明为什么生成这条待办。
  3. 与已有未完成待办（existing_open_todos）语义相同的不再重复生成。
  4. 拿不准的不列：宁可少列，不编造卖家没答应过的动作。
  5. 数量 1~N 条；确实无可生成的返回空数组 todos=[]（空数组是合法产出，不是失败）。
  6. 跟进候选（买家表现出意向/待推进事项）同样以待办形式列出，不单列跟进类型。
suggested_tags_hint: 采购、物流、报价、售后、定制、发货
