# 刘全业务库 Alembic 配置（详设-v0.2 §2.2：tm schema 三表迁移，v0.2 新增）
#
# script_location 指向本目录 versions/（初始迁移 0001 三表 DDL 对齐详设 §3）。
# sqlalchemy.url 不写在此处：env.py 从 .env 的 LIUQUAN_TM_DB_URL 读取
# （未设报错退出，规范 R20：DB URL 只存 .env；也可用 `-x db_url=<url>` 注入）。
# 与 migrations/engine/ 同款 async 模式（承 v0.1 技术定）。
# 本套迁移与引擎库迁移是两套独立迁移（双 database 物理隔离，详设 §2.2）：
# 版本表 alembic_version 落在各自库，互不干扰。

[alembic]
# script_location = 本 ini 所在目录（含 env.py；修订脚本在 versions/ 子目录，
# alembic 默认 version_locations = script_location/versions）
# %(here)s = 本 ini 文件所在目录（绝对路径），与运行 cwd 无关
script_location = %(here)s
prepend_sys_path = %(here)s/../..
# 占位：env.py 会用 LIUQUAN_TM_DB_URL 覆盖（见 env.py）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
