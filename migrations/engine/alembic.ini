# 刘全引擎库 Alembic 配置（T6；详设-v0.1 §3 引擎库 4 表）
#
# script_location 指向本目录 versions/（初始迁移 0001 四表 DDL 对齐详设 §3）。
# sqlalchemy.url 不写在此处：env.py 从环境变量 LIQUAN_ENGINE_DB_URL 读取
# （未设报错退出，规范 R20：DB URL 只存 .env）。

[alembic]
# script_location = 本 ini 所在目录（含 env.py；修订脚本在 versions/ 子目录，
# alembic 默认 version_locations = script_location/versions）
# %(here)s = 本 ini 文件所在目录（绝对路径），与运行 cwd 无关
script_location = %(here)s
prepend_sys_path = %(here)s/../..
# 占位：env.py 会用 LIQUAN_ENGINE_DB_URL 覆盖（见 env.py）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
