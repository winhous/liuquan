[project]
name = "liuquan"
version = "0.1.0"
description = "刘全 - Etsy 综合智能运营系统（AI 引擎 v0.1 地基）"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=10.0.0",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.35.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
liuquan-engine = "engine.cli:main"

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "version_acceptance: v0.1/v0.2 验收断言（开发流程⑤/A1-A11 + A12-A26）；跑法：pytest -m version_acceptance",
]
