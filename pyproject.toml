[project]
name = "liuquan"
version = "0.1.0"
description = "刘全 - Etsy 综合智能运营系统（AI 引擎 v0.1 地基）"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.35.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
liuquan-engine = "engine.cli:main"

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
