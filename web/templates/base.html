<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}刘全 · 综合智能运营系统{% endblock %}</title>
  <!-- Tabler 1.4（现代后台模板，MIT） -->
  <link rel="stylesheet" href="/static/vendor/tabler/plugins/tabler-icons/css/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="page">
  <!-- 顶栏 -->
  <header class="navbar navbar-expand-md navbar-light d-print-none">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topbar-menu" aria-label="菜单">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-brand flex-fill text-truncate">{% block topbar_title %}任务中心{% endblock %}</div>
      <div class="navbar-nav flex-row order-md-last">
        <div class="nav-item dropdown">
          <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown">
            <span class="avatar avatar-sm" style="background:#3b82f6;color:#fff;">{{ (role|default('客'))[0] }}</span>
            <div class="d-none d-xl-block ps-2">
              <div>{{ role|default('访客') }}</div>
              <div class="mt-1 small text-muted">刘全 · 智能运营系统</div>
            </div>
          </a>
          <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
            <a href="/login" class="dropdown-item"><i class="ti ti-switch-horizontal me-2"></i>切换角色</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 侧边栏：整体系统框架（L1 模块导航） -->
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-label="侧栏">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a href="/tasks" class="navbar-brand">
        <span class="navbar-brand-image" style="background:#3b82f6;color:#fff;display:grid;place-items:center;font-weight:700;border-radius:8px;width:30px;height:30px;">刘</span>
        刘全
      </a>
      <div class="collapse navbar-collapse" id="sidebar-menu">
        <ul class="navbar-nav pt-lg-3">
          {% for m in modules %}
          <li class="nav-item">
            <a href="/modules/{{ m.id }}" class="nav-link {{ 'active' if m.id == active else '' }}">
              <span class="nav-link-icon"><i class="ti {{ m.icon }}"></i></span>
              <span class="nav-link-title">{{ m.name }}</span>
            </a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </aside>

  <!-- 内容区 -->
  <div class="page-wrapper">
    <div class="container-fluid">
      <div class="page-header">
        <h1 class="page-title">{% block content_title %}任务中心{% endblock %}</h1>
      </div>
      <div class="page-body">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
<script src="/static/vendor/tabler/js/tabler.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
