{% extends "base.html" %}
{% block title %}{{ module.name }} · 刘全{% endblock %}
{% block content_title %}{{ module.name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card card-outline card-info">
      <div class="card-body text-center py-5">
        <i class="{{ module.icon }}" style="font-size:56px;color:#3b82f6;"></i>
        <h3 class="mt-3">{{ module.name }}</h3>
        <p class="text-muted">{{ module.desc }}</p>
        <p class="text-muted small">该模块在对应版本落地（见版本规划），当前为整体系统框架占位。</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
