{# 扒图设置卡片块（整页 include + HTMX 局部刷新片段共用） #}
<div class="card" id="scrape-settings-card">
  <div class="card-header">
    <h3 class="card-title">扒图设置</h3>
  </div>
  <div class="card-body">
    <form hx-post="/settings/scrape" hx-target="#scrape-settings-card" hx-swap="outerHTML">
      <div class="mb-3">
        <label class="form-label">存储目录</label>
        <input name="storage_dir" type="text" class="form-control" value="{{ storage_dir }}" placeholder="/opt/liuquan/scrape/">
        <small class="text-muted">
          扒图产物落该目录下 xhs/ 与 xianyu/ 与 crm/ 子目录。
          同步上传夸克网盘的默认开关见下方「上传默认开启」（批 7 起支持自动上传 + 历史补传）。
        </small>
        <!-- 复核反馈 2（2026-09-03）：打开存储根目录按钮（刘全所在机器的文件管理器；无桌面环境时展示路径提示） -->
        <button type="button" class="btn btn-outline-primary btn-sm mt-1 btn-open-folder"
                data-folder-kind="root">打开存储目录</button>
        <small id="open-folder-msg" class="d-block mt-1 text-muted"></small>
      </div>
      <button class="btn btn-primary">保存扒图设置</button>
    </form>
    {% if msg %}
    <div class="alert alert-success mt-3 mb-0" role="alert">
      <i class="ti ti-check me-1"></i>{{ msg }}
    </div>
    {% endif %}
    {% if err %}
    <div class="alert alert-danger mt-3 mb-0" role="alert">
      <i class="ti ti-alert-triangle me-1"></i>{{ err }}
    </div>
    {% endif %}
  </div>
</div>
